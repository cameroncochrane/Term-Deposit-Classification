name: CI/CD

# GitHub only ever reads workflows from .github/workflows/ at the repo root - that's a platform
# constraint, not a scope violation. Every step below still only touches app/: lint, test, and
# the Docker build context are all scoped to that directory, same as local development.

on:
  push:
    branches: ["**"]

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: term-deposit-classification-api
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::934912969749:role/term-deposit-classification-github-actions-deploy

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt ruff==0.17.3 pytest httpx

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest tests/

      - name: Set up QEMU (arm64 emulation for the Docker build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (validation only - not pushed)
        run: |
          docker build --platform linux/arm64 --provenance=false --sbom=false \
            -t term-deposit-api:ci -f Dockerfile .

  deploy:
    needs: lint-test-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to assume the AWS role via OIDC
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC - no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check if this commit's image tag already exists
        # Tags are immutable (see app/infra/terraform/README or the ECR repo config), so a retry
        # of a commit whose image already got pushed on an earlier attempt (e.g. this job failed
        # later at the Terraform step and got re-run) must not try to push the same tag again.
        # If it's already there, that artifact is already correct - skip straight to deploying it.
        id: check-image
        run: |
          if aws ecr describe-images --repository-name "${{ env.ECR_REPOSITORY }}" \
            --image-ids imageTag="${{ github.sha }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU (arm64 emulation for the Docker build)
        if: steps.check-image.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.check-image.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.check-image.outputs.exists == 'false'
        env:
          ECR_URI: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/arm64 --provenance=false --sbom=false \
            -t "$ECR_URI:$IMAGE_TAG" -f Dockerfile .
          docker push "$ECR_URI:$IMAGE_TAG"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"

      - name: Terraform init
        working-directory: app/infra/terraform
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: app/infra/terraform
        run: terraform apply -input=false -auto-approve -var "image_tag=${{ github.sha }}"

      - name: Warm up the function
        # A fresh image deploy always cold-starts on its next invocation - importing pandas/
        # scikit-learn/xgboost and unpickling the model is slow enough to have timed out here
        # before (see incident: INIT_REPORT ... Status: timeout). Absorb that cold start with a
        # direct `aws lambda invoke`, which respects the full lambda_timeout (60s); API Gateway's
        # own integration timeout is hard-capped at 30s and can't give a cold start that much room.
        working-directory: app/infra/terraform
        run: |
          FUNCTION_NAME=$(terraform output -raw lambda_function_name)
          cat > /tmp/warmup_event.json << 'EOF'
          {
            "version": "2.0",
            "routeKey": "$default",
            "rawPath": "/health",
            "rawQueryString": "",
            "headers": {"content-type": "application/json"},
            "requestContext": {
              "http": {"method": "GET", "path": "/health", "protocol": "HTTP/1.1", "sourceIp": "127.0.0.1", "userAgent": "ci-warmup"},
              "domainName": "example.com",
              "stage": "$default"
            },
            "body": null,
            "isBase64Encoded": false
          }
          EOF
          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --payload fileb:///tmp/warmup_event.json \
            --cli-read-timeout 70 \
            /tmp/warmup_response.json
          echo "Warm-up response:"
          cat /tmp/warmup_response.json

      - name: Smoke test the deployed API
        working-directory: app/infra/terraform
        run: |
          API_URL=$(terraform output -raw api_endpoint)

          check() {
            local method="$1" path="$2" data="$3" attempt status body response
            for attempt in 1 2 3; do
              if [ -n "$data" ]; then
                response=$(curl -s -w '\n%{http_code}' -X "$method" "$API_URL$path" -H "Content-Type: application/json" -d "$data")
              else
                response=$(curl -s -w '\n%{http_code}' "$API_URL$path")
              fi
              status=$(echo "$response" | tail -n1)
              body=$(echo "$response" | sed '$d')
              echo "Attempt $attempt: $method $path -> HTTP $status"
              echo "$body"
              if [ "$status" = "200" ]; then
                return 0
              fi
              sleep 5
            done
            echo "::error::$method $path failed after 3 attempts (last status: $status, body: $body)"
            return 1
          }

          check GET /health ""
          check POST /predict '{"duration":120,"day":15,"month":"may","housing":"yes","job":"technician"}'
