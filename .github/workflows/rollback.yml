name: Rollback

# Manually redeploy a previously-pushed image tag - the exact same `terraform apply -var
# image_tag=...` mechanism the main deploy job uses, just pointed at an older, already-pushed
# tag instead of building a new one. No bespoke rollback logic.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: >
          Image tag to redeploy (a git SHA from a previous successful deploy - see Actions
          history for ci-cd.yml, or run `aws ecr list-images --repository-name
          term-deposit-classification-api` to list what's available in ECR).
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::934912969749:role/term-deposit-classification-github-actions-deploy

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: app/infra/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC - no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply (redeploy requested tag)
        run: terraform apply -input=false -auto-approve -var "image_tag=${{ inputs.image_tag }}"

      - name: Warm up the function
        # Same cold-start issue as ci-cd.yml's deploy job - a fresh image always cold-starts on
        # its next invocation, which can take longer than API Gateway's hard 30s cap allows.
        # Absorb it with a direct invoke (respects the full lambda_timeout) before smoke testing.
        run: |
          FUNCTION_NAME=$(terraform output -raw lambda_function_name)
          cat > /tmp/warmup_event.json << 'EOF'
          {
            "version": "2.0",
            "routeKey": "$default",
            "rawPath": "/health",
            "rawQueryString": "",
            "headers": {"content-type": "application/json"},
            "requestContext": {
              "http": {"method": "GET", "path": "/health", "protocol": "HTTP/1.1", "sourceIp": "127.0.0.1", "userAgent": "ci-warmup"},
              "domainName": "example.com",
              "stage": "$default"
            },
            "body": null,
            "isBase64Encoded": false
          }
          EOF
          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --payload fileb:///tmp/warmup_event.json \
            --cli-read-timeout 70 \
            /tmp/warmup_response.json
          echo "Warm-up response:"
          cat /tmp/warmup_response.json

      - name: Smoke test the deployed API
        run: |
          API_URL=$(terraform output -raw api_endpoint)

          check() {
            local method="$1" path="$2" data="$3" attempt status body response
            for attempt in 1 2 3; do
              if [ -n "$data" ]; then
                response=$(curl -s -w '\n%{http_code}' -X "$method" "$API_URL$path" -H "Content-Type: application/json" -d "$data")
              else
                response=$(curl -s -w '\n%{http_code}' "$API_URL$path")
              fi
              status=$(echo "$response" | tail -n1)
              body=$(echo "$response" | sed '$d')
              echo "Attempt $attempt: $method $path -> HTTP $status"
              echo "$body"
              if [ "$status" = "200" ]; then
                return 0
              fi
              sleep 5
            done
            echo "::error::$method $path failed after 3 attempts (last status: $status, body: $body)"
            return 1
          }

          check GET /health ""
          check POST /predict '{"duration":120,"day":15,"month":"may","housing":"yes","job":"technician"}'
